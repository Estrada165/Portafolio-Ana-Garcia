<!-- ══ Acceso ══ -->
<div id="loginView" class="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <img src="imagenes/logo.png" alt="" width="60" height="60">
    <h1>Panel de Ana</h1>
    <p class="sub">Entra para administrar tu portafolio.</p>
    <div id="loginMsg" class="msg err" hidden role="alert"></div>
    <div class="field"><label for="lEmail">Correo</label><input type="email" id="lEmail" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Contraseña</label>
      <div class="pw"><input type="password" id="lPass" autocomplete="current-password" required>
        <button type="button" class="icon-btn" id="lShow" data-tip="Mostrar contraseña" aria-label="Mostrar contraseña"><svg class="i"><use href="#i-eye"/></svg></button></div></div>
    <button class="btn primary" id="lBtn" type="submit">Entrar</button>
  </form>
</div>

<!-- ══ Configuración faltante ══ -->
<div id="setupView" class="login" hidden>
  <div class="login-card">
    <img src="imagenes/logo.png" alt="" width="60" height="60">
    <h1>Falta conectar Supabase</h1>
    <p class="sub">Abre <b>config.js</b> y pega tu <b>Project URL</b> y tu <b>anon public key</b> (Supabase → Settings → API). Nunca uses la service_role.</p>
  </div>
</div>

<!-- ══ Panel ══ -->
<div id="app" hidden>
  <header class="top"><div class="top-in">
    <a class="brand" href="index.html" target="_blank" rel="noopener"><img src="imagenes/logo.png" alt="" width="34" height="34">Ana García <small>Panel</small></a>
    <nav class="tabs" role="tablist" aria-label="Secciones del panel">
      <button class="tab" role="tab" data-view="home"><svg class="i"><use href="#i-home"/></svg>Resumen</button>
      <button class="tab" role="tab" data-view="works"><svg class="i"><use href="#i-image"/></svg>Piezas</button>
      <button class="tab" role="tab" data-view="pdf"><svg class="i"><use href="#i-doc"/></svg>Guías PDF</button>
      <button class="tab" role="tab" data-view="site"><svg class="i"><use href="#i-gear"/></svg>Sitio</button>
    </nav>
    <div class="top-actions">
      <span class="who" id="who"></span>
      <a class="icon-btn" href="index.html" target="_blank" rel="noopener" data-tip="Ver el sitio público" aria-label="Ver el sitio público"><svg class="i"><use href="#i-external"/></svg></a>
      <button class="icon-btn" id="themeBtn" data-tip="Cambiar tema" aria-label="Cambiar tema claro u oscuro"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="logoutBtn" data-tip="Cerrar sesión" aria-label="Cerrar sesión"><svg class="i"><use href="#i-logout"/></svg></button>
    </div>
  </div></header>

  <main>
    <section class="view" id="v-home" hidden></section>
    <section class="view" id="v-works" hidden></section>
    <section class="view" id="v-pdf" hidden></section>
    <section class="view" id="v-site" hidden></section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="d-head"><h3 id="dlgTitle"></h3><button class="icon-btn ghost" id="dlgX" data-tip="Cerrar" aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="d-body" id="dlgBody"></div>
  <div class="d-foot" id="dlgFoot"></div>
</dialog>
<div id="progress" class="progress-card" hidden role="status" aria-live="polite"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="filePick" hidden>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
